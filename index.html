<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="mydesign.css">
    <script defer src="quiz.js"></script>
    <title>Quiz</title>
</head>
<body>
<h1 class="text-3xl font-bold text-center mt-6 mb-6 pd-6 pb-6 text-gray-500 rounded-full shadow-md bg-white" >QUESTION POUR UN CHAMPION!</h1>

<div class="bg-gray-100 p-8 rounded-md shadow-md max-w-md mx-auto">
    <form id="quizForm" class="space-y-6">
        <div class="question">
            <p class="font-semibold mb-3 text-gray-700">1. Quelle est la capitale de la France?</p>
            <div class="space-y-2">
                <label class="flex items-center border rounded-md px-3 py-2 bg-white">
                    <input type="radio" name="q1" value="paris" class="form-radio h-4 w-4 text-orange-500 focus:ring-orange-500 border-gray-300" required>
                    <span class="ml-2 text-gray-700">Paris</span>
                </label>
                <label class="flex items-center border rounded-md px-3 py-2 bg-white">
                    <input type="radio" name="q1" value="lyon" class="form-radio h-4 w-4 text-orange-500 focus:ring-orange-500 border-gray-300">
                    <span class="ml-2 text-gray-700">Lyon</span>
                </label>
                <label class="flex items-center border rounded-md px-3 py-2 bg-white">
                    <input type="radio" name="q1" value="marseille" class="form-radio h-4 w-4 text-orange-500 focus:ring-orange-500 border-gray-300">
                    <span class="ml-2 text-gray-700">Marseille</span>
                </label>
            </div>
        </div>

        <div class="question">
            <p class="font-semibold mb-3 text-gray-700">2. Qui a peint la Joconde?</p>
            <div class="space-y-2">
                <label class="flex items-center border rounded-md px-3 py-2 bg-white">
                    <input type="radio" name="q2" value="vinci" class="form-radio h-4 w-4 text-orange-500 focus:ring-orange-500 border-gray-300" required>
                    <span class="ml-2 text-gray-700">Leonard de Vinci</span>
                </label>
                <label class="flex items-center border rounded-md px-3 py-2 bg-white">
                    <input type="radio" name="q2" value="picasso" class="form-radio h-4 w-4 text-orange-500 focus:ring-orange-500 border-gray-300">
                    <span class="ml-2 text-gray-700">Pablo Picasso</span>
                </label>
                <label class="flex items-center border rounded-md px-3 py-2 bg-white">
                    <input type="radio" name="q2" value="vangogh" class="form-radio h-4 w-4 text-orange-500 focus:ring-orange-500 border-gray-300">
                    <span class="ml-2 text-gray-700">Vincent Van Gogh</span>
                </label>
            </div>
        </div>

        <div class="question">
            <p class="font-semibold mb-3 text-gray-700">3. Combien font 2 + 2?</p>
            <div class="space-y-2">
                <label class="flex items-center border rounded-md px-3 py-2 bg-white">
                    <input type="radio" name="q3" value="3" class="form-radio h-4 w-4 text-orange-500 focus:ring-orange-500 border-gray-300" required>
                    <span class="ml-2 text-gray-700">3</span>
                </label>
                <label class="flex items-center border rounded-md px-3 py-2 bg-white">
                    <input type="radio" name="q3" value="4" class="form-radio h-4 w-4 text-orange-500 focus:ring-orange-500 border-gray-300">
                    <span class="ml-2 text-gray-700">4</span>
                </label>
                <label class="flex items-center border rounded-md px-3 py-2 bg-white">
                    <input type="radio" name="q3" value="5" class="form-radio h-4 w-4 text-orange-500 focus:ring-orange-500 border-gray-300">
                    <span class="ml-2 text-gray-700">5</span>
                </label>
            </div>
        </div>

        <div class="question">
            <p class="font-semibold mb-3 text-gray-700">4. Quelle est la plus grande planète du système solaire?</p>
            <div class="space-y-2">
                <label class="flex items-center border rounded-md px-3 py-2 bg-white">
                    <input type="radio" name="q4" value="mars" class="form-radio h-4 w-4 text-orange-500 focus:ring-orange-500 border-gray-300" required>
                    <span class="ml-2 text-gray-700">Mars</span>
                </label>
                <label class="flex items-center border rounded-md px-3 py-2 bg-white">
                    <input type="radio" name="q4" value="jupiter" class="form-radio h-4 w-4 text-orange-500 focus:ring-orange-500 border-gray-300">
                    <span class="ml-2 text-gray-700">Jupiter</span>
                </label>
                <label class="flex items-center border rounded-md px-3 py-2 bg-white">
                    <input type="radio" name="q4" value="saturne" class="form-radio h-4 w-4 text-orange-500 focus:ring-orange-500 border-gray-300">
                    <span class="ml-2 text-gray-700">Saturne</span>
                </label>
            </div>
        </div>

        <div class="question">
            <p class="font-semibold mb-3 text-gray-700">5. Quel est l'élément chimique de symbole H?</p>
            <div class="space-y-2">
                <label class="flex items-center border rounded-md px-3 py-2 bg-white">
                    <input type="radio" name="q5" value="helium" class="form-radio h-4 w-4 text-orange-500 focus:ring-orange-500 border-gray-300" required>
                    <span class="ml-2 text-gray-700">Hélium</span>
                </label>
                <label class="flex items-center border rounded-md px-3 py-2 bg-white">
                    <input type="radio" name="q5" value="hydrogene" class="form-radio h-4 w-4 text-orange-500 focus:ring-orange-500 border-gray-300">
                    <span class="ml-2 text-gray-700">Hydrogène</span>
                </label>
                <label class="flex items-center border rounded-md px-3 py-2 bg-white">
                    <input type="radio" name="q5" value="azote" class="form-radio h-4 w-4 text-orange-500 focus:ring-orange-500 border-gray-300">
                    <span class="ml-2 text-gray-700">Azote</span>
                </label>
            </div>
        </div>

        <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 rounded-md focus:outline-none focus:shadow-outline">Valider</button>
    </form>

    <div id="result" class="mt-6 font-semibold text-gray-700"></div>
</div>
    
</body>
</html>
